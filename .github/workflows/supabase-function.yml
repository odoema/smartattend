# Deploys the API (Supabase Edge Function) whenever its code changes on main.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Deploy API to Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/supabase-function.yml"]
  workflow_dispatch:
env:
  PROJECT_REF: gbyvlotgjrtrnogtbemi
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy smartattend-api
        run: supabase functions deploy smartattend-api --project-ref "$PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
