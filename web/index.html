<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E6655">
<meta name="description" content="SmartAttend — secure class attendance verified by account, registered phone, location, timetable and fingerprint.">
<title>SmartAttend</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar" id="bar" hidden>
  <a class="brand" href="#/"><span class="logo-tile"><img src="logo-mark.png" alt="" width="40" height="31"></span><span class="wordmark">SmartAttend</span></a>
  <span class="clock" id="clock" title="Campus time in Kampala" aria-label="Campus time"></span>
  <div class="who" id="who"></div>
  <button class="btn ghost small" id="signout">Sign out</button>
</header>
<main id="view" class="wrap" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<noscript>SmartAttend needs JavaScript turned on.</noscript>
<script src="config.js"></script>
<script src="catalog.js"></script>
<script src="webauthn.min.js"></script>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
